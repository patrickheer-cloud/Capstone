{% extends 'crm/base.html' %}

{% block title %}Add Task - {{ contact.name }}{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 20px;">Add Task for {{ contact.name }}</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="description">Task Description *</label>
            <textarea id="description" name="description" required placeholder="e.g., Send proposal, Follow up on potential sale"></textarea>
        </div>
        
        <div class="form-group">
            <label for="due_date">Due Date (MM/DD/YYYY) *</label>
            <input type="text" id="due_date" name="due_date" required placeholder="MM/DD/YYYY">
        </div>
        
        <button type="submit" class="btn">Save Task</button>
        <a href="{% url 'contact_detail' contact.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
