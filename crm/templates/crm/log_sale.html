{% extends 'crm/base.html' %}

{% block title %}Log Sale - {{ contact.name }}{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 20px;">Log Sale for {{ contact.name }}</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="item_description">Item Description *</label>
            <textarea id="item_description" name="item_description" required></textarea>
        </div>
        
        <div class="form-group">
            <label for="amount">Dollar Amount *</label>
            <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00">
        </div>
        
        <div class="form-group">
            <label for="sale_date">Sale Date (MM/DD/YYYY) *</label>
            <input type="text" id="sale_date" name="sale_date" required placeholder="MM/DD/YYYY">
        </div>
        
        <button type="submit" class="btn btn-success">Save Sale</button>
        <a href="{% url 'contact_detail' contact.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
